name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── Gate: tests must pass before anything is published ──────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run python -m pytest --tb=short -q

  # ── Build and publish to GitHub Releases ─────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: write   # required to create the GitHub release

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload dist for PyPI job
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  # ── Publish to PyPI via Trusted Publishing (OIDC, no tokens) ────────────────
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    environment:
      name: pypi
      url: https://pypi.org/p/grapheneos-flasher

    permissions:
      id-token: write   # required for PyPI Trusted Publishing

    steps:
      - name: Download dist
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
