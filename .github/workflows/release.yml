name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

jobs:
  # ── Gate: decide whether this push should produce a release ─────────────────
  check:
    name: Check version
    runs-on: ubuntu-latest

    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Determine version and whether to release
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Manual tag push: always release under that tag.
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(grep -Po '(?<=^__version__ = ")[^"]+' grapheneos_flasher/__init__.py)
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version bumped to $VERSION — releasing as $TAG."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Gate: tests must pass before anything is published ──────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.release == 'true'

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run python -m pytest --tb=short -q

  # ── Build and publish to GitHub Releases ─────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [check, test]

    permissions:
      contents: write   # required to create the tag and the GitHub release

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.14"

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          # On a main push the tag does not exist yet; the release action
          # creates it at the triggering commit.
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload dist for PyPI job
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  # ── Publish to PyPI via Trusted Publishing (OIDC, no tokens) ────────────────
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    environment:
      name: pypi
      url: https://pypi.org/p/grapheneos-flasher

    permissions:
      id-token: write   # required for PyPI Trusted Publishing

    steps:
      - name: Download dist
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
